name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          ANCHOR_KEYSTORE_BASE64: ${{ secrets.ANCHOR_KEYSTORE_BASE64 }}
          ANCHOR_KEYSTORE_PASSWORD: ${{ secrets.ANCHOR_KEYSTORE_PASSWORD }}
          ANCHOR_KEY_ALIAS: ${{ secrets.ANCHOR_KEY_ALIAS }}
          ANCHOR_KEY_PASSWORD: ${{ secrets.ANCHOR_KEY_PASSWORD }}
        run: |
          for v in ANCHOR_KEYSTORE_BASE64 ANCHOR_KEYSTORE_PASSWORD ANCHOR_KEY_ALIAS ANCHOR_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required signing secret: $v"
              exit 1
            fi
          done
          printf '%s' "$ANCHOR_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/anchor-release.jks"

      - name: Test and build signed release APK
        env:
          ANCHOR_KEYSTORE_FILE: ${{ runner.temp }}/anchor-release.jks
          ANCHOR_KEYSTORE_PASSWORD: ${{ secrets.ANCHOR_KEYSTORE_PASSWORD }}
          ANCHOR_KEY_ALIAS: ${{ secrets.ANCHOR_KEY_ALIAS }}
          ANCHOR_KEY_PASSWORD: ${{ secrets.ANCHOR_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Anchor.apk

      - name: Verify release APK signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          CERTS="$("$APKSIGNER" verify --print-certs Anchor.apk)"
          echo "$CERTS"
          if echo "$CERTS" | grep -q "Android Debug"; then
            echo "::error::Release APK was signed with the debug keystore!"
            exit 1
          fi

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/anchor-release.jks"

      - name: Upload APK artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Anchor.apk
          path: Anchor.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Anchor.apk --clobber
          else
            gh release create "$TAG" Anchor.apk \
              --title "Anchor ${TAG#v}" \
              --generate-notes
          fi
